name: extended-safety

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches:
      - main
      - "gate1a/**"
    paths:
      - Cargo.toml
      - Cargo.lock
      - "apps/**"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - README.md
      - .github/workflows/extended-safety.yml

permissions:
  contents: read

concurrency:
  group: extended-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extended-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85.1
        with:
          components: llvm-tools-preview
      - name: Install pinned coverage tool
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Record run metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p safety-artifacts/coverage
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            sha256sum Cargo.lock .github/workflows/extended-safety.yml
            rustc --version --verbose
            cargo --version --verbose
            cargo llvm-cov --version
          } | tee safety-artifacts/run-metadata.log

      - name: Locked workspace regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --locked --workspace --all-targets -- --nocapture 2>&1 \
            | tee safety-artifacts/workspace-tests.log

      - name: Deeper deterministic authority model
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo run --locked -p quorumarc-sim -- --depth 12 --require-safe 2>&1 \
            | tee safety-artifacts/model-depth-12.log

      - name: Repeat real-process witness lab
        shell: bash
        run: |
          set -Eeuo pipefail
          : > safety-artifacts/process-lab-repetitions.log
          for iteration in $(seq 1 16); do
            {
              echo "iteration=${iteration} suite=parallel-process-lab"
              cargo test --locked -p quorumarc-lab --tests -- --nocapture
            } 2>&1 | tee -a safety-artifacts/process-lab-repetitions.log
          done

      - name: Repeat integrated one-shot three-process lab
        shell: bash
        run: |
          set -Eeuo pipefail
          : > safety-artifacts/cluster-genesis-repetitions.log
          for iteration in $(seq 1 16); do
            {
              echo "iteration=${iteration} suite=lab-genesis-one-shot"
              cargo test --locked -p quorumarc-cluster --test three_process -- \
                --nocapture --test-threads=1
            } 2>&1 | tee -a safety-artifacts/cluster-genesis-repetitions.log
          done

      - name: Repeat A/B/Witness lifecycle and automatic controller lab
        shell: bash
        run: |
          set -Eeuo pipefail
          : > safety-artifacts/lifecycle-process-repetitions.log
          for iteration in $(seq 1 8); do
            {
              echo "iteration=${iteration} suite=lifecycle-and-auto-controller"
              cargo test --locked -p quorumarc-cluster --test lifecycle_process -- \
                --nocapture --test-threads=1
            } 2>&1 | tee -a safety-artifacts/lifecycle-process-repetitions.log
          done

      - name: Collect bounded automatic failover performance samples
        shell: bash
        run: |
          set -Eeuo pipefail
          : > safety-artifacts/lifecycle-failover-samples.log
          failures=0
          for iteration in $(seq 1 20); do
            echo "iteration=${iteration} suite=bounded-automatic-failover-performance" \
              | tee -a safety-artifacts/lifecycle-failover-samples.log
            set +e
            cargo test --locked -p quorumarc-cluster \
              --test lifecycle_process \
              autonomous_controller_process_executes_bounded_sigkill_failover -- \
              --exact --nocapture --test-threads=1 2>&1 \
              | tee -a safety-artifacts/lifecycle-failover-samples.log
            status="${PIPESTATUS[0]}"
            set -e
            echo "iteration=${iteration} exit_status=${status}" \
              | tee -a safety-artifacts/lifecycle-failover-samples.log
            if [ "${status}" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          printf 'samples=20\nfailures=%s\n' "${failures}" \
            | tee safety-artifacts/lifecycle-failover-sample-status.log
          test "${failures}" -eq 0

      - name: Gate bounded logical failover percentiles
        shell: bash
        run: |
          set -Eeuo pipefail
          metrics_directory="$(mktemp -d)"
          extract_metric() {
            local metric_name="$1"
            local metric_path="$2"
            awk -v prefix="${metric_name}=" '{
              for (field = 1; field <= NF; field++) {
                if (index($field, prefix) == 1) {
                  value = substr($field, length(prefix) + 1)
                  sub(/[^0-9].*$/, "", value)
                  if (value != "") print value
                }
              }
            }' safety-artifacts/lifecycle-failover-samples.log \
              | sort -n > "${metric_path}"
            test "$(wc -l < "${metric_path}")" -eq 20
          }
          percentile() {
            local metric_path="$1"
            local percent="$2"
            local sample_count
            sample_count="$(wc -l < "${metric_path}")"
            local rank=$(( (sample_count * percent + 99) / 100 ))
            sed -n "${rank}p" "${metric_path}"
          }
          maximum() {
            local metric_path="$1"
            tail -n 1 "${metric_path}"
          }
          failover_metric="${metrics_directory}/failover"
          detection_metric="${metrics_directory}/detection"
          lease_wait_metric="${metrics_directory}/lease-wait"
          promotion_metric="${metrics_directory}/promotion"
          effect_metric="${metrics_directory}/effect"
          extract_metric failure_to_effect_ms "${failover_metric}"
          extract_metric failure_detection_ms "${detection_metric}"
          extract_metric lease_wait_ms "${lease_wait_metric}"
          extract_metric promotion_ms "${promotion_metric}"
          extract_metric effect_ms "${effect_metric}"
          failover_p50_ms="$(percentile "${failover_metric}" 50)"
          failover_p95_ms="$(percentile "${failover_metric}" 95)"
          failover_p99_ms="$(percentile "${failover_metric}" 99)"
          failures="$(awk -F= '$1 == "failures" { print $2 }' safety-artifacts/lifecycle-failover-sample-status.log)"
          failure_rate_percent="$(awk -v failures="${failures}" 'BEGIN { printf "%.2f", failures * 100 / 20 }')"
          {
            echo "metric=bounded_logical_failover"
            echo "scope=github_shared_host_monotonic_quantized_lab_time_test_sink"
            echo "samples=20"
            echo "failures=${failures}"
            echo "failure_rate_percent=${failure_rate_percent}"
            echo "failure_to_effect_p50_ms=${failover_p50_ms}"
            echo "failure_to_effect_p95_ms=${failover_p95_ms}"
            echo "failure_to_effect_p99_ms=${failover_p99_ms}"
            echo "failure_to_effect_max_ms=$(maximum "${failover_metric}")"
            echo "failure_detection_p50_ms=$(percentile "${detection_metric}" 50)"
            echo "failure_detection_p95_ms=$(percentile "${detection_metric}" 95)"
            echo "failure_detection_p99_ms=$(percentile "${detection_metric}" 99)"
            echo "failure_detection_max_ms=$(maximum "${detection_metric}")"
            echo "lease_wait_p50_ms=$(percentile "${lease_wait_metric}" 50)"
            echo "lease_wait_p95_ms=$(percentile "${lease_wait_metric}" 95)"
            echo "lease_wait_p99_ms=$(percentile "${lease_wait_metric}" 99)"
            echo "lease_wait_max_ms=$(maximum "${lease_wait_metric}")"
            echo "promotion_p50_ms=$(percentile "${promotion_metric}" 50)"
            echo "promotion_p95_ms=$(percentile "${promotion_metric}" 95)"
            echo "promotion_p99_ms=$(percentile "${promotion_metric}" 99)"
            echo "promotion_max_ms=$(maximum "${promotion_metric}")"
            echo "effect_p50_ms=$(percentile "${effect_metric}" 50)"
            echo "effect_p95_ms=$(percentile "${effect_metric}" 95)"
            echo "effect_p99_ms=$(percentile "${effect_metric}" 99)"
            echo "effect_max_ms=$(maximum "${effect_metric}")"
            echo "maximum_failure_to_effect_p95_ms=5000"
          } | tee safety-artifacts/lifecycle-failover-percentiles.log
          test "${failures}" -eq 0
          test "${failover_p95_ms}" -le 5000

      - name: Repeat durable-store crash recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          : > safety-artifacts/store-crash-recovery-repetitions.log
          for iteration in $(seq 1 16); do
            {
              echo "iteration=${iteration} suite=durable-store-crash-recovery"
              cargo test --locked -p quorumarc-store --tests -- \
                --nocapture --test-threads=1
            } 2>&1 | tee -a safety-artifacts/store-crash-recovery-repetitions.log
          done

      - name: Bounded deterministic malformed-input campaign
        shell: bash
        run: |
          set -Eeuo pipefail
          : > safety-artifacts/malformed-parser.log
          cases=(
            malformed_truncations_are_all_rejected
            version_downgrade_is_rejected
            unknown_trailing_field_is_rejected
            malformed_utf8_identifier_is_rejected
            oversized_wire_objects_are_rejected_before_parsing
            bounded_structural_malformed_campaign_never_panics_or_accepts
            bounded_changed_byte_campaign_never_authenticates
          )
          for case_name in "${cases[@]}"; do
            {
              echo "case=${case_name} suite=bounded-malformed-parser"
              cargo test --locked -p quorumarc-wire "${case_name}" -- \
                --nocapture --test-threads=1
            } 2>&1 | tee -a safety-artifacts/malformed-parser.log
          done

      - name: Measure workspace coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --all-targets --no-report 2>&1 \
            | tee safety-artifacts/coverage/coverage-tests.log
          cargo llvm-cov report --lcov \
            --output-path safety-artifacts/coverage/lcov.info
          cargo llvm-cov report --json \
            --output-path safety-artifacts/coverage/coverage.json
          cargo llvm-cov report --summary-only 2>&1 \
            | tee safety-artifacts/coverage/summary.txt
          workspace_line_coverage="$(
            jq -er '.data[0].totals.lines.percent' \
              safety-artifacts/coverage/coverage.json
          )"
          printf 'workspace_line_coverage=%s\nminimum_workspace_line_coverage=80.0\n' \
            "${workspace_line_coverage}" \
            | tee safety-artifacts/coverage/quality-gate.txt
          awk -v actual="${workspace_line_coverage}" \
            'BEGIN { if ((actual + 0) < 80.0) exit 1 }'

      - name: Build auditable x86_64 Ubuntu release binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --locked --workspace --release
          mkdir -p safety-artifacts/release
          for binary in quorumarc-agent quorumarc-witness quorumarc-cluster quorumarc-lab quorumarc-sim; do
            test -x "target/release/${binary}"
            cp "target/release/${binary}" safety-artifacts/release/
          done
          sha256sum safety-artifacts/release/* \
            | tee safety-artifacts/release/SHA256SUMS
          file safety-artifacts/release/quorumarc-* \
            | tee safety-artifacts/release/file-types.log
          ldd safety-artifacts/release/quorumarc-agent \
            | tee safety-artifacts/release/dynamic-dependencies.log

      - name: Verify and package one-command Gate 1A lab
        shell: bash
        run: |
          set -Eeuo pipefail
          safety-artifacts/release/quorumarc-cluster self-test \
            --allow-lab-genesis 2>&1 \
            | tee safety-artifacts/release/self-test.log
          bash scripts/package-gate1a-lab.sh \
            safety-artifacts/release safety-artifacts/bundle
          sha256sum --check \
            safety-artifacts/bundle/quorumarc-gate1a-lab-x86_64-ubuntu.tar.gz.sha256
          repeat_dir="$(mktemp -d)"
          trap 'rm -rf -- "${repeat_dir}"' EXIT
          bash scripts/package-gate1a-lab.sh \
            safety-artifacts/release "${repeat_dir}"
          cmp \
            safety-artifacts/bundle/quorumarc-gate1a-lab-x86_64-ubuntu.tar.gz \
            "${repeat_dir}/quorumarc-gate1a-lab-x86_64-ubuntu.tar.gz"

      - name: Upload extended safety evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: safety-artifacts
          if-no-files-found: error
          retention-days: 30
