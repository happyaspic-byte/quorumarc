name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      # Temporary while Gate 1A dependencies are first resolved on this branch.
      # The generated lockfile is committed and this step removed before merge.
      - name: Resolve Gate 1A dependency lock
        run: cargo generate-lockfile
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets
      - name: Gate 0 deterministic model
        run: cargo run --locked -p quorumarc-sim -- --depth 10 --require-safe
